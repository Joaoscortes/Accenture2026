<body class="container">
  <form class="mt-3">
    <div class="row">
      <div class="col-12 col-md-8 mb-3">
        <div class="row">
          <label class="col-2" for="input1">String</label>
          <input class="col-10" type="text" id="input1">
        </div>

      </div>

      <button class="col-12 col-md-4 btn btn-primary" type="button" onclick="resolve()">Resolve</button>
    </div>

  </form>

  <div id="resultTable"></div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="../Aula 11 - Table Lib - rev 1/Table Lib/myTableLib.js"></script>
  <script>
    /*Contar Frequência dos Números
      Objetivo

      Receber uma sequência de números separados por espaços e indicar quantas vezes 
      aparece cada número.

      Exemplo

      Input

      1 2 3 2 4 1 2

      Output

      1 -> 2 vezes
      2 -> 3 vezes
      3 -> 1 vez
      4 -> 1 vez
      Regras
      Utilizar apenas um input.
      Mostrar o resultado num novo elemento HTML.
      Não utilizar bibliotecas externas.
      Não utilizar Map/Set.
      */

    function resolve() {
      //input
      let useInput = document.getElementById("input1").value;
      //TODO validate 3 min and empies spaces


      // logic
      const userNumbers = useInput.split(" ");

      const counter = {};

      for (const number of userNumbers) {
        if (counter[number]) {
          counter[number]++
        } else {
          counter[number] = 1
        }
      }


      // Output
      const resultTable = new MyTable("resultTable", ["number", "count"])

      for (const number in counter) {
        resultTable.pushToData({
          number: number,
          count: counter[number]
        })
      }
      console.log(counter);

      resultTable.init()
    }
  </script>
