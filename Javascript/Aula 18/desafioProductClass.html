<!doctype html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Produtos</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container py-5">
    <!------
    | Form |
    ------->
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow">
          <div class="card-header bg-primary text-white">
            <h2 class="mb-0">Desafio - Gestor de Produtos</h2>
          </div>

          <div class="card-body">
            <form id="productForm">
              <div class="mb-3">
                <label class="form-label">Nome do Produto</label>
                <input
                  type="text"
                  id="name"
                  class="form-control"
                  placeholder="Ex: Portátil"
                  required>
              </div>

              <div class="mb-3">
                <label class="form-label">Preço (€)</label>
                <input
                  type="number"
                  id="price"
                  class="form-control"
                  min="0"
                  step="0.01"
                  required>
              </div>

              <div class="mb-3">
                <label class="form-label">Quantidade</label>
                <input
                  type="number"
                  id="quantity"
                  class="form-control"
                  min="1"
                  required>
              </div>

              <button
                type="submit"
                class="btn btn-success w-100">
                Adicionar Produto
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-------
    | Table |
    -------->
    <div class="row mt-5">
      <div class="col">
        <div class="card shadow">
          <div class="card-header">
            <h4 class="mb-0">Inventário</h4>
          </div>

          <div class="card-body">
            <table class="table table-striped table-hover">
              <thead class="table-dark">
                <tr>
                  <th>Produto</th>
                  <th>Preço</th>
                  <th>Quantidade</th>
                  <th>Total</th>
                </tr>
              </thead>

              <tbody id="tableBody">
              </tbody>
            </table>

            <div class="alert alert-info mt-3">
              <strong>Valor Total do Inventário:</strong>
              <span id="inventoryValue">0.00 €</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    /*
    Objetivo - Criar um pequeno catálogo de produtos.
    
    Formulário:
    Nome
    Preço
    Quantidade
    
    Logic:
    Class-> "Nome, Preço, Quantidade"
    totalValue() -> preço * quantidade
    
    Resultado
    
    Tabela:
    Produto	Preço	Quantidade	Total
    A       200   5           1000€
    B       500   1           500€
    
    Text:
    Valor total do inventário: 1500€
    */
    class Product {
      constructor(name, price, quantity) {
        this.name = name;
        this.price = price;
        this.quantity = quantity;
      }

      totalValue() {
        return this.price * this.quantity;
      }
    }

    const products = [];
    const form = document.getElementById("productForm");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const price = parseFloat(document.getElementById("price").value);
      const quantity = parseInt(document.getElementById("quantity").value);

      // Add validators : name!="" | price/quantity > 0

      const product = new Product(
        name,
        price,
        quantity
      );

      products.push(product);
      updateTable();
      form.reset();
    });

    function updateTable() {
      let inventoryTotal = 0;
      const tableBody = document.getElementById("tableBody");

      tableBody.innerHTML = "";

      for (const product of products) {
        inventoryTotal += product.totalValue();

        tableBody.innerHTML += `
                    <tr>
                        <td>${product.name}</td>
                        <td>${product.price.toFixed(2)} €</td>
                        <td>${product.quantity}</td>
                        <td>${product.totalValue().toFixed(2)} €</td>
                    </tr>
                `;

      }

      document.getElementById("inventoryValue").innerHTML =
        inventoryTotal.toFixed(2) + " €";
    }
  </script>
</body>

</html>
