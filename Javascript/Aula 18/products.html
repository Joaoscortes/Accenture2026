<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Title</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  // Form
  <form>
    <input type="text">
    <input type="number">
    <input type="number">

    <button onclick="addProduct()">Add Product</button>
  </form>

  // Table
  <table>
    <thead>
      <tr>
        <th>Produto</th>
        <th>Preço</th>
        <th>Quantidade</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <p id="totalInventory"></p>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    /*
Objetivo - Criar um pequeno catálogo de produtos.

Formulário:
Nome
Preço
Quantidade

Logic:
Class-> "Nome, Preço, Quantidade"
totalValue() -> preço * quantidade

Resultado

Tabela:
Produto	Preço	Quantidade	Total
A       200   5           1000€
B       500   1           500€

Text:
Valor total do inventário: 1500€
    */
    // Class
    class Product {
      constructor(name, price, quantity) {
        this.name = name;
        this.price = price;
        this.quantity = quantity;
      }

      totalValue() {
        return this.price * this.quantity;
      }
    }

    // Inputs
    function getProductDataFromForm() {
      return {
        name: document.getElementById("inputName").value,
        price: document.getElementById("inputPrice").value,
        quantity: document.getElementById("inputQuantity").value,
      }

    }

    // Logic
    function addProduct() {
      // Inputs
      const inputValues = getProductDataFromForm();

      // create object from class
      const newProduct = new Product(inputValues.name, inputValues.price, inputValues.quantity)

      addProductToTableBody(newProduct);
    }

    // Output
    function addProductToTableBody(product) {
      document.getElementById("tableBody").insertAdjacentHTML("beforeend", `
      <tr>
        <td>${product.name}</td>
        <td>${product.price}</td>
        <td>${product.quantity}</td>
        <th>${product.totalValue()}</th>
      </tr>
      `)
    }


  </script>

</body>

</html>
