  <script>
    function getDataFromGoogleBooksApi(query) {
      let key = "KEY";
      let url = `https://www.googleapis.com/books/v1/volumes?q=${query}&key=${key}`
      fetch(url)
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP Error: ${response.status}`);
          }

          return response.json();
        })
        .then(data => {
          console.log(data);
          console.log(data.items);
          // methods for logic
        })
        .catch(error => {
          console.error(error);
        });
    }

  </script>
