<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <title>Tinder Books</title>
</head>

<body class="vh-100 d-flex">

    <div id="login" class="container m-auto text-center">
        <img src="https://img.buzzfeed.com/buzzfeed-static/static/2015-07/2/11/enhanced/webdr11/enhanced-9342-1435850061-1.jpg"
            class="w-50">
        <div class="form-group mb-5">
            <label for="username">Enter Username</label>
            <input type="text" class="form-control" id="username" onkeypress="inputEnter(event, 'login')"
                placeholder="Username">
        </div>
        <button class="btn btn-primary mt-5" onclick="getUserByUsername()">Login / Register</button>
    </div>

    <div id="main" class="container d-none">
        <div id="header"></div>
        <div class="accordion" id="accordionExample">
            <div class="bg-success">
                <div class="card-header" id="headingOne">
                    <h2 class="mb-0">
                        <button class="btn text-light" type="button" data-bs-toggle="collapse"
                            data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                            Settings
                        </button>
                    </h2>
                </div>

                <div id="collapseOne" class="collapse" aria-labelledby="headingOne" data-bs-parent="#accordionExample">
                    <div class="card-body">
                        <input id="currentUsername" onkeypress="inputEnter(event, 'updateUsername')" class="form-control mr-sm-2 my-2"
                            type="search" placeholder="Username">
                        <input id="h-search" onkeypress="inputEnter(event, 'booksearch')" class="form-control mr-sm-2 my-2"
                            type="search" placeholder="Search">
                    </div>
                </div>
            </div>
        </div>
        <div class="text-center h-75 d-flex">
            <div class="m-auto">
                <button class="btn btn-outline-success my-2 my-sm-0" onclick="getBooksFromGoogle()">Search</button>
            </div>
        </div>
    </div>

    <!-- Optional JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentUser = {};

        function inputEnter(event, input) {
            const char = event.code;
            const key = event.key;
            if (char === 'Enter' || key === 'Enter') {
                switch (input) {
                    case "login":
                        getUserByUsername();
                        break;
                    case "booksearch":
                        getBooksFromGoogle();
                        break;
                    case "updateUsername":
                        updateUserById();
                        break;
                }
            }
        }

        function stateView() {
            if (currentUser.id != undefined) {
                document.getElementById("login").classList.add("d-none");
                document.getElementById("main").classList.remove("d-none");
                updateHeader();
            } else {
                document.getElementById("login").classList.remove("d-none");
                document.getElementById("main").classList.add("d-none");
            }
        }

        function updateHeader() {
            document.getElementById("header").innerHTML = `

                <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                    <a class="navbar-brand" href="#">UpAcademy Tinder</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo02" aria-controls="navbarTogglerDemo02" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarTogglerDemo02">
                        <ul class="navbar-nav mr-auto mt-2 mt-lg-0">
                        <li class="nav-item">
                            <span class="navbar-text">Welcome ${currentUser.username}</span>
                        </li>
                        </ul>
                        <div class="form-inline my-2 my-lg-0">
                        <button class="btn btn-outline-danger my-2 my-sm-0" onclick="logout()">Logout</button>
                        </div>

                    </div>
                </nav>
            `;
            document.getElementById("currentUsername").value = currentUser.username;
        }

        async function getUserByUsername() {
            const username = document.getElementById("username").value;
            const filter = JSON.stringify({
                where: {
                    username: username
                },
                include: "books"
            });

            try {
                const response = await fetch(`https://aai-books-852480dfe047.herokuapp.com/api/users/?filter=${encodeURIComponent(filter)}`);
                if (!response.ok) {
                    throw new Error(`Request failed with status ${response.status}`);
                }

                const data = await response.json();
                if (data.length === 0) {
                    await addUser(username);
                } else {
                    currentUser = data[0];
                    stateView();
                }
            } catch (error) {
                console.error("Erro:", error);
            }
        }

        async function addUser(username) {
            const tempUser = {
                username: username
            };

            try {
                const response = await fetch('https://aai-books-852480dfe047.herokuapp.com/api/users', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(tempUser)
                });

                if (!response.ok) {
                    throw new Error(`Request failed with status ${response.status}`);
                }

                const data = await response.json();
                currentUser = data;
                stateView();
            } catch (error) {
                console.error("Erro:", error);
            }
        }

        async function deleteUserById() {
            const id = document.getElementById("userId").value;

            try {
                const response = await fetch('https://aai-books-852480dfe047.herokuapp.com/api/users/' + id, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error(`Request failed with status ${response.status}`);
                }

                console.log("Deleted");
            } catch (error) {
                console.error("Erro:", error);
            }
        }

        async function updateUserById() {
            currentUser.username = document.getElementById("currentUsername").value;

            try {
                const response = await fetch('https://aai-books-852480dfe047.herokuapp.com/api/users/' + currentUser.id, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(currentUser)
                });

                if (!response.ok) {
                    throw new Error(`Request failed with status ${response.status}`);
                }
                currentUser = await response.json();
                updateHeader();

                console.log("Updated: ", user);
            } catch (error) {
                console.error("Erro:", error);
            }
        }

        async function addBook() {
            const tempBook = {
                name: document.getElementById("bookName").value
            };

            try {
                const response = await fetch('https://aai-books-852480dfe047.herokuapp.com/api/users/' + currentUser.id + '/books', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(tempBook)
                });

                if (!response.ok) {
                    throw new Error(`Request failed with status ${response.status}`);
                }

                const data = await response.json();
                console.log(data);
            } catch (error) {
                console.error("Erro:", error);
            }
        }

        function getBooksFromGoogle() {
            console.log("getBooksFromGoogle function", document.getElementById("h-search").value);
        }

        function logout() {
            currentUser = {};
            stateView();
        }
    </script>
</body>

</html>
