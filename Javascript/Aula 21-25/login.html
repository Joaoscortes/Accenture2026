<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Title</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <input type="text" id="username">
  <button onclick="login()">Login</button>
  <button onclick="createUser()">Create</button>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    let currentUser = null;

    function login() {
      let username = document.getElementById('username').value;
      getUserByUsername(username)
    }

    function createUser() {
      let username = document.getElementById('username').value;
      addUser(username)
    }

    function sendBook() {
      let title = "Harry Potter";
      addBook(title)
    }

    function logout() {
      currentUser = null;
    }


    // Methods For Users API

    // Searches for a user using their username and loads the matching record.
    function getUserByUsername(username) {

      fetch(
        'https://aai-books-852480dfe047.herokuapp.com/api/users/findOne?filter={"where":{"username":"' + username + '"},"include":"books"}')
        .then(
          response => {
            if (response.ok) {
              return response.json()
            }
            console.error("Erro : ", response.status);
          }
        ).then(data => {
          console.log(data);
          currentUser = data;
        })
    }

    // Creates a new user with the value entered in the username field.
    function addUser(username) {
      tempUser = {
        username: username,
        code: 1234
      }
      console.log(tempUser);
      fetch(
        'https://aai-books-852480dfe047.herokuapp.com/api/users', {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify(tempUser)
      }).then(
        response => {
          if (response.ok) {
            return response.json();
          }
          console.error("Erro : ", response.status);
        }
      ).then(data => {
        console.log(data);
      })
    }

    // Adds a new book to the currently selected user using the current user ID.
    function addBook(title) {
      let tempBook = {
        title: title
      }
      fetch(
        'https://aai-books-852480dfe047.herokuapp.com/api/users/' + currentUser.id + '/books', {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify(tempBook)
      }).then(
        response => {
          if (response.ok) {
            return response.json();
          }
          console.error("Erro : ", response.status);
        }
      ).then(data => {
        console.log(data);
      })
    }

  </script>
</body>

</html>
